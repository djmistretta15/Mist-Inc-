events {
    worker_connections 1024;
}

http {
    upstream trust_engine {
        server trust-engine:3001;
    }

    upstream scheduler {
        server scheduler:3002;
    }

    upstream identity {
        server identity:3003;
    }

    upstream payments {
        server payments:3004;
    }

    upstream compliance {
        server compliance:3005;
    }

    upstream analytics {
        server analytics:3006;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $http_authorization zone=user_limit:10m rate=1000r/m;

    server {
        listen 80;
        server_name _;

        # Global settings
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Trust Engine API
        location /api/v1/trust {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://trust_engine/api/v1/trust;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Scheduler API
        location /api/v1/schedule {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://scheduler/api/v1/schedule;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Identity API
        location /api/v1/auth {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://identity/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/users {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://identity/api/v1/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payments API
        location /api/v1/payments {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://payments/api/v1/payments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/transactions {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://payments/api/v1/transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Compliance API
        location /api/v1/audit {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://compliance/api/v1/audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/compliance {
            limit_req zone=user_limit burst=20 nodelay;

            proxy_pass http://compliance/api/v1/compliance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Analytics API
        location /api/v1/analytics {
            limit_req zone=user_limit burst=10 nodelay;

            proxy_pass http://analytics/api/v1/analytics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-all for other routes
        location / {
            return 404 '{"error": "Not found"}\n';
            add_header Content-Type application/json;
        }
    }
}
